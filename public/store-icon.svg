<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="#fbbf24" opacity="0.1" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Store building base -->
  <rect x="50" y="70" width="100" height="80" fill="#fbbf24" rx="4"/>
  
  <!-- Door -->
  <rect x="85" y="100" width="30" height="50" fill="#d97706" rx="2"/>
  <circle cx="112" cy="125" r="3" fill="#fef3c7"/>
  
  <!-- Windows top -->
  <rect x="60" y="80" width="18" height="18" fill="#fef3c7" rx="2"/>
  <rect x="85" y="80" width="18" height="18" fill="#fef3c7" rx="2"/>
  <rect x="110" y="80" width="18" height="18" fill="#fef3c7" rx="2"/>
  <rect x="135" y="80" width="18" height="18" fill="#fef3c7" rx="2"/>
  
  <!-- Roof -->
  <polygon points="50,70 100,30 150,70" fill="#d97706"/>
  
  <!-- Roof accent -->
  <line x1="100" y1="30" x2="100" y2="70" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Lock detail on top -->
  <circle cx="100" cy="45" r="5" fill="#fef3c7" opacity="0.8"/>
  <path d="M 97 47 Q 100 49 103 47" stroke="#fef3c7" stroke-width="1.5" fill="none"/>
</svg>
